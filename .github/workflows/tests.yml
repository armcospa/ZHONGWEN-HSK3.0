name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[deck,test]" pyflakes
      - run: python -m pyflakes src tests
      # Includes tests/test_decks.py, which fails if decks/*.apkg is out of
      # date with the templates or data: run zhongwen-anki-build-all.
      - run: pytest
